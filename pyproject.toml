[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
# TASK-4177: the catalog icon served at <mcp-url>/icon.png
hydrata_mcp = ["assets/icon.png"]

[project]
name = "hydrata-mcp-server"
version = "0.2.2"
description = "MCP server for Hydrata hydraulic modeling platform"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastmcp==4.1.4",  # TASK-3166: prod ran 3.0.2 under >=2.0; pass-through needs 4.0.5 get_http_headers(include=)
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.1", "respx==0.23.1", "ruff==0.17.3"]

[project.scripts]
hydrata-mcp = "hydrata_mcp.server:main"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
