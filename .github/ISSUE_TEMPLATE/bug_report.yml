name: Bug report
description: Something in the server does not behave as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security problems here (see SECURITY.md). Never paste keys, tokens or real project data.
  - type: input
    id: version
    attributes:
      label: Version
      description: "`pip show hydrata-mcp-server` or the version in pyproject.toml"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The tool, its arguments (with ids anonymised) and the response you got.
    validations:
      required: true
