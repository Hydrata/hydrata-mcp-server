name: Feature request
description: Suggest a new tool or a change to an existing one
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Do not report security problems here (see SECURITY.md).
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like the server to do?
      description: Tool name, inputs, what it returns.
