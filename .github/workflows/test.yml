name: test

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install from the checkout (locked)
        run: uv sync --frozen --extra dev
      - name: hydrata_mcp must import from this checkout, not a stray install
        env:
          WANT_PY: ${{ matrix.python-version }}
        run: |
          uv run --frozen --extra dev python -c "
          import os, pathlib, sys, hydrata_mcp
          here = pathlib.Path.cwd().resolve()
          src = pathlib.Path(hydrata_mcp.__file__).resolve()
          assert here in src.parents, f'hydrata_mcp imported from {src}, not {here}'
          got = '%d.%d' % sys.version_info[:2]
          assert got == os.environ['WANT_PY'], f'matrix asked for {os.environ[\"WANT_PY\"]}, venv runs {got}'
          print('hydrata_mcp from', src, 'on Python', got)"
      - name: make check
        # The Makefile runs each tool via `uv run --locked --extra dev`, so this is the
        # same command CONTRIBUTING.md documents (and it fails if uv.lock is stale).
        run: make check

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra dev
      - name: ruff + version parity
        run: make lint parity
