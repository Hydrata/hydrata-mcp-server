name: test

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install from the checkout (locked)
        run: uv sync --frozen --extra dev
      - name: hydrata_mcp must import from this checkout, not a stray install
        run: |
          uv run --frozen --extra dev python -c "
          import pathlib, hydrata_mcp
          here = pathlib.Path.cwd().resolve()
          src = pathlib.Path(hydrata_mcp.__file__).resolve()
          assert here in src.parents, f'hydrata_mcp imported from {src}, not {here}'
          print('hydrata_mcp from', src)"
      - name: make check
        run: uv run --frozen --extra dev make check

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra dev
      - name: ruff + version parity
        run: uv run --frozen --extra dev make lint parity
