name: test

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install from the checkout (locked)
        run: uv sync --frozen --extra dev
      - name: hydrata_mcp must import from this checkout, not a stray install
        run: |
          uv run --frozen --extra dev python -c "
          import pathlib, hydrata_mcp
          here = pathlib.Path.cwd().resolve()
          src = pathlib.Path(hydrata_mcp.__file__).resolve()
          assert here in src.parents, f'hydrata_mcp imported from {src}, not {here}'
          print('hydrata_mcp from', src)"
      - name: make check
        run: uv run --frozen --extra dev make check

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra dev
      - name: ruff + version parity
        run: uv run --frozen --extra dev make lint parity
